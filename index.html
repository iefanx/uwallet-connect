<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- This page only passes requests between uWallet and your Nostr extension. It loads nothing
     from anywhere else and cannot send data to any server (connect-src 'none'). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>uWallet · Nostr</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f7931a'/%3E%3Cpath d='M18 4 7 18h8l-1.5 10L25 13h-8z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <button class="icon-btn" id="back" aria-label="Back to uWallet" title="Back to uWallet" hidden><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
  <span class="bar-title" id="title">uWallet</span>
  <span class="icon-btn lock" title="Your Nostr key stays in your Nostr extension. This page can’t send data anywhere."><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
</header>
<main class="page" aria-live="polite">
  <!-- One row: who is signing in (picture, name, npub), and a pulse while waiting. -->
  <div id="who" class="who">
    <span class="av" id="who-av"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M15 8l2 2"/></svg></span>
    <span class="who-t"><b id="who-name">Connecting…</b><small id="who-npub">Your Nostr extension</small></span>
    <span class="wire" aria-hidden="true"><i></i><i></i><i></i></span>
  </div>
  <p id="lead" class="lead"></p>
  <!-- Progress: what is happening now, then every step by name (done, now, next). -->
  <div class="track" id="track">
    <div class="now">
      <span class="now-ic" id="now-ic"></span>
      <span class="now-t"><b id="now-label">Getting ready…</b><small id="now-sub"></small></span>
    </div>
    <ol class="steps" id="steps"></ol>
    <div class="track-ask" id="track-ask"></div>
  </div>
  <div id="panel" class="panel"></div>
</main>
<script src="connect.js"></script>
</body>
</html>
